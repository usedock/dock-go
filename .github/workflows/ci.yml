name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-go v7.0.0
      # staticcheck v0.8.1 cannot read Go 1.27 export data, so lint on 1.26.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.x'
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest Go in go.mod, and the current release.
        go: ['1.22.x', 'stable']
    name: test (go ${{ matrix.go }})
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-go v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ matrix.go }}
      - name: go vet
        run: go vet ./...
      - name: Test (scenarios skipped without the suite)
        run: go test -race -count=1 ./...
      - name: Read pinned scenarios ref
        id: ref
        run: echo "sha=$(tr -d '[:space:]' < SCENARIOS_REF)" >> "$GITHUB_OUTPUT"
      # actions/checkout v7.0.1
      - name: Check out shared scenarios
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: usedock/dock
          ref: ${{ steps.ref.outputs.sha }}
          path: dock
          sparse-checkout: sdk-scenarios
      - name: Scenario suite (offline fixtures)
        env:
          DOCK_SCENARIOS_DIR: ${{ github.workspace }}/dock/sdk-scenarios
        # shell: bash adds pipefail, so a failing go test is not hidden by tee.
        shell: bash
        run: |
          go test -race -count=1 -run 'TestScenarios|TestCommandsMatchFixtures|TestFileCommandsInBash' -v ./... | tee scenarios.log
          if grep -qE -- '--- SKIP: (TestScenarios/offline|TestCommandsMatchFixtures|TestFileCommandsInBash)' scenarios.log; then echo "scenario or file command tests were skipped"; exit 1; fi
          for t in TestCommandsMatchFixtures TestFileCommandsInBash; do grep -q -- "--- PASS: $t " scenarios.log || { echo "$t did not pass"; exit 1; }; done

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --no-banner --redact
